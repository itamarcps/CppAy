name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-numpy
      - run: cmake --preset core-debug
      - run: cmake --build --preset core-debug --parallel 2
      - run: ctest --preset core-debug --no-tests=error --output-junit core-tests.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: core-sanitizer-tests
          path: core-tests.xml
          if-no-files-found: ignore
          retention-days: 14

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      XDG_CONFIG_HOME: ${{ github.workspace }}/build/ci-config
      XDG_DATA_HOME: ${{ github.workspace }}/build/ci-data
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libpulse0 libasound2t64
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt aqtinstall==3.3.0
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Qt 6.11.2
        run: |
          python -m aqt install-qt linux desktop 6.11.2 linux_gcc_64 --outputdir "$RUNNER_TEMP/Qt" --modules qtmultimedia qtshadertools qtsvg
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/Qt/6.11.2/gcc_64" >> "$GITHUB_ENV"
          # Declare this SDK as the runner's system runtime. Package checks
          # remove development Qt/QML environment overrides.
          echo "$RUNNER_TEMP/Qt/6.11.2/gcc_64/lib" | sudo tee /etc/ld.so.conf.d/cppay-ci-qt.conf
          sudo ldconfig
      - run: cmake --preset linux-release
      - run: cmake --build --preset linux-release --parallel 2
      - run: ctest --preset linux-release --no-tests=error --output-junit desktop-tests.xml
      - name: Three/six-channel layouts
        run: |
          mkdir -p build/ci-review
          cd build/ci-review
          ../C++Ay --layout-smoke-test ../../tests/fixtures/integration.pt3 ../../tests/fixtures/native-ts.pt3
          ../C++Ay --window-smoke-test
      - name: Public independent fidelity (required; no private music)
        run: python tools/release_fidelity.py --renderer build/aytool --output build/public-fidelity
      - name: Build Linux system-runtime package
        run: python tools/package_linux.py --build-dir build --output build/packages
      - name: Extracted package startup and export
        run: |
          mkdir -p "$RUNNER_TEMP/cppay-package"
          tar -xf build/packages/C++Ay-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/cppay-package"
          installed=$(find "$RUNNER_TEMP/cppay-package" -name C++Ay -type f)
          cd "$RUNNER_TEMP/cppay-package"
          "$installed" --window-smoke-test
          "$(dirname "$installed")/aytool" render "$GITHUB_WORKSPACE/tests/fixtures/integration.pt3" package-export.wav
          cmp package-export.wav "$GITHUB_WORKSPACE/build/integration-reference.wav"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-checks
          path: |
            desktop-tests.xml
            build/ci-review/evidence/
            build/public-fidelity/
            build/packages/*.tar.gz
          if-no-files-found: ignore
          retention-days: 14
